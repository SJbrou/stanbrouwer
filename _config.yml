# Build settings
markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge

collections:
  projects:
    output: true
    permalink: /projects/:name/

project_columns:
  - key: date
    label: DATE
    format: "%d %m"
  - key: title
    label: TITLE
  - key: project-category
    label: PROJECT CATEGORY

plugins:
  - jekyll-feed
#  - jekyll-paginate
  - jekyll-sitemap ## Uncomment this line to silently generate a sitemaps.org compliant sitemap for your Jekyll site

include:
  - _pages

defaults:
  - scope:
      path: "_projects"
      type: projects
    values:
      layout: project

exclude:
  - archive
  - vendor
  - .bundle
  - .sass-cache
  - _site
  - node_modules
  - app_script.txt
  - Gemfile
  - Gemfile.lock
  - README.md
  - LICENSE
  - assets/invites-sample.tsv
