<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light">
    <title>{{ page.title | default: 'Invite' | escape }} - {{ site.title | escape }}</title>
    <meta name="description" content="{{ page.description | default: 'An invitation by Stan Brouwer.' | escape }}">
    <link rel="canonical" href="{{ page.url | absolute_url }}">
    <link rel="stylesheet" href="{{ '/assets/styles/collection.css' | relative_url }}?v={{ site.time | date: '%s' }}">
    <script>
      window.TZ_INVITES_CONFIG = {
        sheetId: {{ site.invites_sheet_id | jsonify }},
        sheetName: {{ site.invites_sheet_name | default: 'INVITES' | jsonify }}
      };
    </script>
    <script src="{{ '/assets/js/invites.js' | relative_url }}?v={{ site.time | date: '%s' }}" defer></script>
    <script src="{{ '/assets/js/invite-detail.js' | relative_url }}?v={{ site.time | date: '%s' }}" defer></script>
  </head>
  <body class="collection-body invite-body">
    {{ content }}
  </body>
</html>
