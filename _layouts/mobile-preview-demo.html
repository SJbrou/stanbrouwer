<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light">
  <meta name="robots" content="noindex, nofollow">
  <title>{{ page.title }} — {{ site.title }}</title>
  <link rel="icon" href="{{ '/assets/img/favicon.svg' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/styles/collection.css' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/styles/project-details.css' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/styles/ticketing.css' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/styles/invite-experience.css' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/styles/mobile-preview.css' | relative_url }}">
  <script>
    window.COLLECTION_PROJECTS_CONFIG = {
      homeUrl: {{ '/mobile/design-preview/demo/' | relative_url | jsonify }},
      detailUrl: {{ '/mobile/design-preview/demo/' | relative_url | jsonify }},
      exampleImage: {{ '/assets/img/de_loods.jpg' | relative_url | jsonify }},
      transitionGridImage: {{ '/assets/img/black-white-perspective-grid-background-vector.jpg' | relative_url | jsonify }}
    };
    window.MOBILE_PREVIEW_ASSETS = {
      harbour: {{ '/assets/img/de_loods.jpg' | relative_url | jsonify }},
      home: {{ '/assets/img/thuis_oranje.JPG' | relative_url | jsonify }}
    };
  </script>
  <script src="{{ '/assets/js/invites.js' | relative_url }}" defer></script>
  <script src="{{ '/assets/js/collection-projects.js' | relative_url }}" defer></script>
  <script src="{{ '/assets/js/invite-detail.js' | relative_url }}" defer></script>
  <script src="{{ '/assets/js/invite-ticketing.js' | relative_url }}" defer></script>
  <script src="{{ '/assets/js/collection-transition.js' | relative_url }}" defer></script>
  <script src="{{ '/assets/js/invite-experience.js' | relative_url }}" defer></script>
  <script src="{{ '/assets/js/mobile-preview-data.js' | relative_url }}" defer></script>
  <script src="{{ '/assets/js/collection-welcome.js' | relative_url }}" defer></script>
  <script src="{{ '/assets/js/collection.js' | relative_url }}" defer></script>
  <script src="{{ '/assets/js/mobile-preview-window.js' | relative_url }}" defer></script>
  <script src="{{ '/assets/js/mobile-preview-demo.js' | relative_url }}" defer></script>
</head>
<body class="collection-body mobile-preview-demo">
  <nav class="mobile-chapter-nav" aria-label="Collection sections" hidden>
    <div><a href="#invites-title" data-current-chapter>Invites</a><button type="button" data-index-toggle aria-expanded="false" aria-controls="mobile-chapter-index">Index +</button></div>
    <div id="mobile-chapter-index" hidden>
      <a href="#collection-page-title" data-cover-link>Cover</a>
      <a href="#invites-title">Invites</a><a href="#words-title">Words</a><a href="#sounds-title">Sounds</a><a href="#places-title">Places</a><a href="#projects-title">Projects</a>
    </div>
  </nav>
  {% include collection-home.html %}
  <main class="collection-page project-detail-page" data-mobile-detail hidden></main>
  <div class="mobile-bottom-dock">
    <aside class="mobile-audio" aria-label="Sample audio player" hidden>
      <div class="mobile-audio__track"><span data-audio-title></span><small data-audio-time>Sample audio</small></div>
      <button type="button" data-audio-play aria-label="Pause sample audio">Ⅱ</button>
      <button type="button" data-audio-expand aria-label="Expand audio player">↗</button>
      <button type="button" data-audio-close aria-label="Close audio player">×</button>
    </aside>
    <div class="mobile-booking-dock" hidden><span data-booking-summary></span><button type="button" data-booking-action></button></div>
  </div>
  <dialog class="mobile-media-dialog" aria-labelledby="mobile-dialog-title">
    <header><h2 id="mobile-dialog-title"></h2><button type="button" data-dialog-close aria-label="Close preview">×</button></header>
    <div data-dialog-content></div>
  </dialog>
  <p class="mobile-screen-status" role="status" data-mobile-status></p>
  <noscript><p style="padding:16px">Enable JavaScript to explore the sample collection, or <a href="{{ '/' | relative_url }}">return to the collection</a>.</p></noscript>
</body>
</html>
