<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light">
    <link rel="icon" type="image/svg+xml" href="{{ '/assets/img/favicon.svg' | relative_url }}">
    <title>{{ page.title | default: 'Tickets' | escape }} - {{ site.title | escape }}</title>
    <link rel="canonical" href="{{ page.url | absolute_url }}">
    <link rel="stylesheet" href="{{ '/assets/styles/collection.css' | relative_url }}?v={{ site.time | date: '%s' }}">
    <link rel="stylesheet" href="{{ '/assets/styles/project-details.css' | relative_url }}?v={{ site.time | date: '%s' }}">
    {% include booking-assets.html %}
  </head>
  <body class="collection-body tz-page">
    {% if page.url == '/tickets/' %}
      {{ content }}
    {% else %}
      {% include collection-invite-detail.html %}
    {% endif %}
  </body>
</html>
