<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light">
    <link rel="icon" type="image/svg+xml" href="{{ '/assets/img/favicon.svg' | relative_url }}">
    <title>{{ page.title | default: 'Tickets' | escape }} - {{ site.title | escape }}</title>
    <link rel="canonical" href="{{ page.url | absolute_url }}">
    {% include collection-shell-head.html %}
  </head>
  <body class="collection-body tz-page collection-shell">
    {% include collection-content.html %}
    <div class="collection-route-outlet">
    <main class="collection-page ticket-page">
      <article class="collection-poster ticket-poster" aria-label="Ticket reservation">
        {{ content }}
      </article>

      <footer class="collection-outro ticket-outro">
        <img class="collection-outro__image" src="{{ '/assets/img/black-white-perspective-grid-background-vector.jpg' | relative_url }}" alt="" aria-hidden="true">
        <div class="collection-captions collection-captions--outro">
          <p>a carefully curated<br>collection of experiences</p>
          <p>Stan Brouwer<br>vol. 001</p>
        </div>
      </footer>
    </main>
    </div>
    {% include collection-shell-windows.html %}
  </body>
</html>
