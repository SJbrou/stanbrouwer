# Sample workflow for building and deploying a Jekyll site to GitHub Pages
name: Deploy Jekyll with GitHub Pages dependencies preinstalled

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site

      - name: Build legacy site
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./archive
          destination: ./_legacy_site

      - name: Add legacy site to deployment
        run: |
          mkdir -p ./_site/old
          cp -R ./_legacy_site/old/. ./_site/old/
          cp -R ./_legacy_site/assets ./_site/old/assets
          find ./_site/old -type f \( -name '*.html' -o -name '*.css' \) -exec sed -i \
            -e 's#="/assets/#="/old/assets/#g' \
            -e "s#='/assets/#='/old/assets/#g" \
            -e "s#url('/assets/#url('/old/assets/#g" \
            {} +
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
