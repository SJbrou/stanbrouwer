<head>

  <!-- Meta Tags -->
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

  <title>
    {% if page.title %}{{ page.title | escape }} - {{ site.title | escape }}
    {% else %}{{ site.title | escape }}{% endif %}
  </title>

  <!-- Description Meta Tag -->
  <meta name="description" content="{{ page.excerpt | default: site.description | strip_html | normalize_whitespace | truncate: 160 | escape }}">

  <!-- Open Graph and Twitter Meta Tags (optional for better sharing) -->
  <meta property="og:title" content="{{ page.title | escape }}">
  <meta property="og:description" content="{{ page.excerpt | default: site.description | strip_html | normalize_whitespace | truncate: 160 | escape }}">
  <meta property="og:image" content="{{ site.social_image | default: '/assets/default-social-image.jpg' }}">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{{ page.title | escape }}">
  <meta name="twitter:description" content="{{ page.excerpt | default: site.description | strip_html | normalize_whitespace | truncate: 160 | escape }}">
  <meta name="twitter:image" content="{{ site.social_image | default: '/assets/default-social-image.jpg' }}">

  <!-- FontAwesome Icons -->
  <script src="https://use.fontawesome.com/releases/v5.15.3/js/all.js" crossorigin="anonymous"></script>


  <!-- Custom CSS -->
  <link rel="stylesheet" href="{{ "/old/assets/styles/main.css" | relative_url }}">

  {% if page.layout == 'ticketing' %}
  <link rel="stylesheet" href="{{ '/old/assets/styles/collection.css' | relative_url }}?v={{ site.time | date: '%s' }}">
  <script>
    window.TZ_INVITES_CONFIG = {
      sheetId: {{ site.invites_sheet_id | jsonify }},
      sheetName: {{ site.invites_sheet_name | default: 'INVITES' | jsonify }}
    };
    window.TZ_WEBHOOK_URL = {{ site.ticketing_webhook_url | default: '' | jsonify }};
    window.TZ_WEBHOOK_TOKEN = {{ site.ticketing_webhook_token | default: '' | jsonify }};
  </script>
  <script src="{{ '/old/assets/js/invites.js' | relative_url }}?v={{ site.time | date: '%s' }}" defer></script>
  <script src="{{ '/old/assets/js/invite-ticketing.js' | relative_url }}?v={{ site.time | date: '%s' }}" defer></script>
  {% endif %}

  <!-- Code Syntax Highlighting using rouge Github Theme -->
  <script src="{{ "/old/assets/copycode.js" | relative_url }}" defer></script>


  <!-- Dark Mode Preference (optional, based on user system preferences) -->
  <meta name="color-scheme" content="light dark">

  <!-- Canonical and RSS -->
  <link rel="canonical" href="{{ page.url | replace:'index.html','' | absolute_url }}">
  <link rel="alternate" type="application/rss+xml" title="{{ site.title | escape }}" href="{{ "/feed.xml" | relative_url }}">

  <!-- MathJax? -->
  <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
</head>
